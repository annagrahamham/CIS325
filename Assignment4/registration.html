<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="registration_styles.css">
  <title>Registration Form</title>
</head>
<body>
  <script src="registration_scripts.js"></script>
  <h1>Registration Form</h1> 

<form id="registrationForm">
    <div class="form-container">
  <label for="fname">First Name:</label>
  <input type="text" id="fname" name="fname" minlength="2" required>
  <small id="fnameError" class="error-message"></small>

  <label for="lname">Last Name:</label>
  <input type="text" id="lname" name="lname" minlength="2" required>
  <small id="lnameError" class="error-message"></small>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required>
  <small id="emailError" class="error-message"></small>

  <label for="password">Password:</label>
  <input type="password" id="password" name="password" minlength="8" required>
   <small id="passwordError" class="error-message"></small>
   <small id="numPasswordError" class="error-message"></small>
   <small id="upperPasswordError" class="error-message"></small>

  <label for="confirmPassword">Confirm Password:</label>
  <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" required>
    <small id="confirmPasswordError" class="error-message"></small>

  <label for="age">Age:</label>
  <input type="number" id="age" name="age" min="18" max="120" >
  <small id="ageError" class="error-message"></small>

  <label for="number">Phone Number:</label>
  <input type="tel" id="number" name="number">
    <small id="numberError" class="error-message"></small>
    </div>

  <button type="submit">Submit</button>
</form>

</body>
</html>
